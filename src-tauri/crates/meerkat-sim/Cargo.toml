[package]
name = "meerkat-sim"
version = "0.2.0"
description = "Simulated PTZ cameras for Meerkat's tests and demo mode: Panasonic Easy IP, Sony IP Setup, BirdDog REST, ONVIF and VHD, on loopback"
authors = ["Allan Sargeant"]
edition = "2021"
license = "MIT"

[dependencies]
meerkat-core = { path = "../meerkat-core" }
meerkat-drivers = { path = "../meerkat-drivers" }
md-5 = "0.11"
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
