[package]
name = "meerkat-cli"
version = "0.1.0"
description = "Meerkat from a terminal: find PTZ cameras, change their IP settings, open their web UI"
authors = ["Allan Sargeant"]
edition = "2021"
license = "MIT"

[[bin]]
name = "meerkat-cli"
path = "src/main.rs"

[dependencies]
meerkat-core = { path = "../meerkat-core" }
meerkat-drivers = { path = "../meerkat-drivers" }
meerkat-sim = { path = "../meerkat-sim" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
