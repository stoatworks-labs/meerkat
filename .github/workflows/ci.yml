# Build and test on every platform the app ships for.
#
# The Rust workspace carries the real tests: every driver against the
# simulator on loopback, the engine (merge, reach, temporary addresses), and
# the Tauri command layer on the mock runtime. Every operating system runs it
# all; the front end is typechecked, tested and built once.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lockfile matches manifest
        run: npm ls --all >/dev/null
      - run: npm test
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            name: macOS
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows
    runs-on: ${{ matrix.platform }}
    name: rust — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The app crate embeds the front end at compile time, and
      # `cargo test --workspace` builds it, so dist/ has to exist first.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # The app crate's test binary carries no common-controls manifest
            # on Windows, so it dies at load (STATUS_ENTRYPOINT_NOT_FOUND)
            # before a test runs: a Tauri limitation, not a failing test.
            # Build it and run everything else; macOS and Linux run it.
            cargo test --workspace --exclude meerkat
            cargo test -p meerkat --no-run
          else
            cargo test --workspace
          fi
